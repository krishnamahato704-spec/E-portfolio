name: Inject storage script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: "!contains(github.event.head_commit.message, 'chore: enable persistent portfolio images')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '    <script src="supabase-storage.js"></script>\n'
          if 'supabase-storage.js' not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body>')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: enable persistent portfolio images"
          git push
