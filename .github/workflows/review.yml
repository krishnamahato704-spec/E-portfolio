name: Review redesigned portfolio
on:
  push:
    branches: ["main", "codex/**", "redesign/**", "feature/editorial-motion", "feature/editorial-identity", "feature/recruiter-experience"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://e-portfolio-lake-nine.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:palettes
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:identity
      - name: Verify committed pages match their source
        run: git diff --exit-code -- '*.html' src/styles.css sitemap.xml robots.txt assets/krishna-mahato-resume.pdf
