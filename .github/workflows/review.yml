name: Review redesigned portfolio
on:
  push:
    branches: ["main", "redesign/**", "feature/editorial-motion", "feature/editorial-identity", "feature/recruiter-experience"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify committed pages match their source
        run: git diff --exit-code -- '*.html' sitemap.xml robots.txt
