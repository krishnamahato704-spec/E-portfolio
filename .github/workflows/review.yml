name: Review redesigned portfolio
on:
  push:
    branches: ["redesign/**", "feature/editorial-motion", "feature/editorial-identity", "feature/recruiter-experience"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.mjs
      - name: Verify committed pages match their source
        run: git diff --exit-code -- '*.html' sitemap.xml robots.txt
