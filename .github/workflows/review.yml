name: Review redesigned portfolio
on:
  push:
    branches: ["main", "redesign/**", "feature/editorial-motion", "feature/editorial-identity", "feature/recruiter-experience"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install-deps chromium
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Save production browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-results
          path: outputs/production-checks
