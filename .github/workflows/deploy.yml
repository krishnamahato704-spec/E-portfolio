name: Portfolio CI and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio_content_published]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.content.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: content
        if: github.event_name != 'pull_request'
        run: node scripts/check-published-release.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-input
          path: outputs/release/input.json
  build:
    needs: content
    if: github.event_name != 'schedule' || needs.content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_CONTENT_SOURCE: ${{ github.event_name == 'pull_request' && 'repository' || 'supabase' }}
      BUILD_CONTENT_FILE: outputs/release/input.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-input
          path: outputs/release
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Provide an audio output for native Firefox audio checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=portfolio_test
          pactl set-default-sink portfolio_test
      - run: npm run test:identity
        env:
          IDENTITY_TEST_ENGINES: chromium,firefox
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            outputs/browser-checks
            outputs/redesign
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  opening-webkit:
    needs: content
    if: github.event_name != 'schedule' || needs.content.outputs.changed == 'true'
    # Linux WPE WebKit closes its media page during native video tests.
    # Keep the full WebKit suite required on its native macOS implementation.
    runs-on: macos-latest
    env:
      BUILD_CONTENT_SOURCE: ${{ github.event_name == 'pull_request' && 'repository' || 'supabase' }}
      BUILD_CONTENT_FILE: outputs/release/input.json
      IDENTITY_TEST_ENGINES: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-input
          path: outputs/release
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npm run test:identity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-opening-results
          path: outputs/redesign
  deploy:
    needs: [build, opening-webkit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
